        <script>
            let begun = false
            let orbAmount = 0
            let totalOrbAmount = 0
            let foodAmount = 0

            //settings
            const MAXDEATHTIMER = 30 //in sec (30)
            const HUNGERNEEDEDTOSEARCHFORFOOD = 8 //when this is reached it will clone, in sec (8)
            const HUNGERDEATHAMOUNT = 15 //when this hunger is reached, death, in sec (15)
            const MAXORBS = 250 //once this is hit they will stop spawning (250)
            const STARTINGFOODAMOUNT = 0 //amount of times food can be used before it go boom, 0 is unlimited (10)
            const MOVEMENTSPEED = 1 //in ms (1)
            const CLONESPEED = 3 //in sec (3)
            const SLEEPLENGTH = 1 //in sec (1)

            const MAXSTATDIFFERENCE = 5 //only for blue colour rn (5)
            const RICHNESS = 20 //when no fight or defends, set blue bias to this (20)
            const TOTALSTATBIAS = 15 //the amount that the stats can change in total (15)
            const BASEATTACK = 0 //Is equal to red rgb (0)
            const BASEDEFENCE = 0 //Is equal to green rgb (0)
            const BASEHEALTH = 10 //(10)

            const PIXELSPERCYCLE = 1 //should be set to 1 unless death on wrong movement is set to false (1)
            const DEATHONWRONGMOVE = true //(true)
            
            //needed functions
            const SLEEP = (ms) => new Promise(resolve => setTimeout(resolve, ms))
            function random(maxAmount, minAmount = 0) {
                if (maxAmount > minAmount) {
                    let amount = maxAmount - minAmount
                    return Math.floor(Math.random() * amount) + minAmount
                } else if (maxAmount == minAmount) {
                    return maxAmount
                } else {
                    throw new Error("random() min: " + minAmount + " is larger than max: " + maxAmount)
                }
            }

            class Food {
                constructor(object, x, y, ID, foodLeft) {
                    this.ID = ID
                    this.object = object
                    this.x = 0
                    this.y = 0
                    this.foodLeft = STARTINGFOODAMOUNT
                }

                add(ID) {
                    const newObject = document.createElement("div")
                    newObject.classList.add('Food')
                    newObject.id = ID
                    newObject.dataset.foodLeft = STARTINGFOODAMOUNT
                    newObject.dataset.beingUsedBy = null
                    newObject.textContent = this.foodLeft
                    this.object = newObject
                    this.ID = ID    
                    document.body.appendChild(newObject)

                    this.setPos(random(window.innerWidth), random(window.innerHeight), 1)
                    if (STARTINGFOODAMOUNT != 0) {
                        this.checkFood()
                    } else {
                        newObject.textContent = ""
                    }
                }

                setPos(setX, setY) {
                    this.x = setX
                    this.y = setY
                    this.object.style.left = this.x
                    this.object.style.top = this.y
                }

                async checkFood() {
                    while (true) {
                        this.foodLeft = this.object.dataset.foodLeft
                        this.object.textContent = this.foodLeft
                        if (this.foodLeft == 0) {
                            foodAmount--
                            this.object.remove()
                            this.object = null
                            return
                        }
                        await SLEEP(10)
                    }
                }
            }

            class Orb {
                constructor(ID, ogID, object, x, y, hunger, lengthOfLife, red, green, blue, hasDied) { // put needed to set things before object
                    this.ID = ID
                    this.ogID = ID
                    this.object = object
                    this.x = 0
                    this.y = 0
                    this.hunger = 1
                    this.lengthOfLife = 0
                    this.red = red //attack
                    this.green = green //defence
                    this.blue = blue
                    this.hasDied = false
                }

                add(ID, ogID = ID, red = -1, green = -1, blue = -1, fights = 0, defends = 0) { //should only be called once per orb
                    //basic adding
                    const newOrb = document.createElement("div")
                    this.object = newOrb
                    newOrb.classList.add('Orb')
                    newOrb.id = ID
                    this.ID = ID
                    this.ogID = ogID

                    //so like js dont like this.var so like imma do smth bad... type shit
                    let idOfOG = this.ogID
                    newOrb.addEventListener("click", function() { showInfomation(newOrb, idOfOG, red, green, blue) })

                    if (ID != ogID) {
                        //stat randomizer
                        let maxRed = 255
                        let minRed = 0
                        let maxGreen = 255
                        let minGreen = 0
                        let maxBlue = 255
                        let minBlue = 0

                        let attackBias = parseInt(fights)
                        let defenceBias = parseInt(defends)
                        let blueBias = MAXSTATDIFFERENCE - (attackBias + defenceBias)
                        blueBias = (blueBias < 0) ? 0 : blueBias
                        if (attackBias + defenceBias != TOTALSTATBIAS) { //if total bias is not equal to tsb, contiune
                            let mutiplyer = TOTALSTATBIAS / (attackBias + defenceBias) //fine the multiplyer needed to bring total to tsb
                            if (mutiplyer != Infinity) {
                                attackBias = Math.round(attackBias * mutiplyer) //multiply ab and db by the multiplyer
                                defenceBias = Math.round(defenceBias * mutiplyer)
                            }
                        }

                        if (attackBias == 0 && defenceBias == 0) {
                            attackBias = 1
                            defenceBias = 1
                            blueBias = 20
                        }

                        if (red != -1) { //set up min and max
                            maxRed = red + attackBias
                            minRed = red - (defenceBias + (Math.floor(attackBias / 2)))
                            // minRed = red - defenceBias
                            
                            minRed = minRed < 0 ? 0 : minRed
                            minRed = minRed > 255 ? 255 : minRed

                            maxRed = maxRed < 0 ? 0 : maxRed
                            maxRed = maxRed > 255 ? 255 : maxRed
                            
                        }
                        if (green != -1) {
                            maxGreen = green + defenceBias
                            minGreen = green - (attackBias + (Math.floor(defenceBias / 2)))
                            // minGreen = green - attackBias

                            minGreen = minGreen < 0 ? 0 : minGreen
                            minGreen = minGreen > 255 ? 255 : minGreen

                            maxGreen = maxGreen < 0 ? 0 : maxGreen
                            maxGreen = maxGreen > 255 ? 255 : maxGreen
                        }
                        if (blue != -1) {
                            maxBlue = blue + blueBias
                            minBlue = blue - MAXSTATDIFFERENCE
                            
                            minBlue = minBlue < 0 ? 0 : minBlue
                            minBlue = minBlue > 255 ? 255 : minBlue

                            maxBlue = maxBlue < 0 ? 0 : maxBlue
                            maxBlue = maxBlue > 255 ? 255 : maxBlue
                        }

                        red = random(maxRed, minRed) //random the 'stats' of the orb
                        green = random(maxGreen, minGreen) 
                        blue = random(maxBlue, minBlue)
                    } else {
                        red = BASEATTACK
                        green = BASEDEFENCE
                        blue = 0    
                    }

                    red = Math.round(red)
                    green = Math.round(green)
                    blue = Math.round(blue)
                    
                    this.red = red
                    this.green = green
                    this.blue = blue

                    this.object.style.backgroundColor = "rgb(" + red + "," + green + "," + blue + ")"

                    newOrb.dataset.attack = red
                    newOrb.dataset.defence = green
                    newOrb.dataset.timesAttack = 0
                    newOrb.dataset.timesDefend = 0
                    newOrb.dataset.healthPoints = BASEHEALTH
                    newOrb.dataset.isDead = false

                    //append the child(orb)
                    document.body.appendChild(newOrb)     
                }

                async creation() {
                    if (this.hunger <= 0 && orbAmount < MAXORBS) {
                        orbAmount++
                        totalOrbAmount++
                        const ball = new Orb()
                        ball.x = this.x
                        ball.y = this.y
                        await ball.add("Orb"+totalOrbAmount, this.ogID, this.red, this.green, this.blue, this.object.dataset.timesAttack, this.object.dataset.timesDefend)
                        await ball.move(0, 0)
                        ball.startLogic()
                    }
                }

                async startLogic() {
                    await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)

                    while (true) {
                        //orb logic
                        if (this.hunger >= HUNGERNEEDEDTOSEARCHFORFOOD * 250) {
                            let food = await this.findFood()
                            if (food != 0) {
                                if (food.dataset.beingUsedBy == this.object.id) {
                                    this.hunger = 0
                                    let successful = true
                                    for (let i = CLONESPEED * 250; i != 0; i--) { //this works, don worry gng
                                        if (food.dataset.beingUsedBy == this.object.id) {
                                            await SLEEP(1)
                                        } else {
                                            successful = false
                                            break
                                        }
                                    }
                                    if (await this.deathCheck()) { break }
                                    else if (successful && orbAmount < MAXORBS) { 
                                        await this.creation() 
                                        food.dataset.beingUsedBy = null
                                    }
                                    await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)
                                } else {
                                    await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)
                                }
                            } else {
                                await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)
                            }
                        } else {
                            if (random(4) != 0) { //random chance to stop moving/sleep
                                await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)
                            } else {
                                for (let i = SLEEPLENGTH * 250; i != 0; i--){
                                    await SLEEP(1)
                                    this.lengthOfLife += SLEEPLENGTH
                                    if (await this.deathCheck()) { break }
                                }
                                
                            }
                        }
                        if (await this.deathCheck()) { break }
                    }
                    return
                }

                deathCheck() {
                    if ((this.lengthOfLife >= MAXDEATHTIMER * 1000 || this.object.dataset.isDead == true) && !this.hasDied) {
                        this.hasDied = true
                        this.object.remove()
                        orbAmount--
                        return true
                    } else if ((this.hunger >= HUNGERDEATHAMOUNT * 1000 || this.object.dataset.healthPoints <= 0) && !this.hasDied) {
                        this.hasDied = true
                        this.object.dataset.isDead = true
                        this.object.remove()
                        orbAmount--
                        return true
                    }
                }

                move(Xpx, Ypx) {
                    try {
                        this.y += Ypx
                        this.x += Xpx

                        this.object.style.top = this.y + 'px'
                        this.object.style.left = this.x + 'px'

                        return true
                    } catch {
                        return false
                    }
                }

                async moveTo(goX, goY, MS) {
                    let loop = 0

                    this.x = Math.round(this.x) //to make sure it not decimal 
                    this.y = Math.round(this.y)

                    if (goX == this.x && goY == this.y) { //just in case it is where it needs to go
                        return
                    }

                    let newGoX = Math.abs(goX - this.x)
                    let newGoY = Math.abs(goY - this.y)

                    let divAmount = newGoX + newGoY

                    let smallX = (newGoX * PIXELSPERCYCLE) / divAmount
                    let smallY = (newGoY * PIXELSPERCYCLE) / divAmount

                    if (goX < this.x) { //check if it needs to go left and not right
                        smallX = Math.abs(smallX) * -1
                    }
                    
                    if (goY < this.y) { //same above but for smallY
                        smallY = Math.abs(smallY) * -1
                    }

                    while (loop < Math.round(divAmount / PIXELSPERCYCLE)) { //loop
                        loop++
                        await this.move(smallX, smallY)
                        this.lengthOfLife += MS

                        this.hunger += MS

                        if (await this.deathCheck()) { return }
                        
                        await SLEEP(MS)
                    }

                    this.x = Math.round(this.x) //just in case the num is like 835.0000000000001 or smth
                    this.y = Math.round(this.y)
                    this.object.style.top = this.y + 'px' //set the pos again for the round above
                    this.object.style.left = this.x + 'px'
                    
                    if ((goX != this.x || goY != this.y) && DEATHONWRONGMOVE) { //If the end pos is not equal to the go pos
                        this.object.style.width = "200px"
                        this.object.style.height = "200px"
                        for (let i = 0; i < 30; i++) {
                            this.object.style.backgroundColor = "rgb("+random(255)+","+random(255)+","+random(255)+")"
                            await SLEEP(10)
                        }
                        this.object.remove()
                        this.deathCheck()

                        throw new Error("oopies, move to position, (x:" + goX + ", y:" + goY + ") is not equal to end position, (x:" + this.x + " y:" + this.y + ")")
                    }
                }

                findClosest(array) { //takes an array of objects
                    let smallestDistance = Infinity //set the vars
                    let closestObject = null

                    for (let i = 0; i < array.length; i++) { //loop for each object in the array
                        let object = array[i] 

                        let x = parseInt(object.style.left.substring(0, object.style.left.length - 2)) //remove the px from the pos
                        let y = parseInt(object.style.top.substring(0, object.style.top.length - 2))

                        let distance = Math.sqrt(((x - this.x)**2) + ((y - this.y)**2)) //find the distance between the two points(trust me bro, i do math)

                        if (distance < smallestDistance) { //check if distance is smaller than the current biggest
                            smallestDistance = distance //set min distance
                            closestObject = array[i] //set closest object to the closest
                        }
                    }
                    return closestObject
                }

                async findFood() {
                    if (foodAmount == 0) {
                        return 0
                    }
                    let foods = document.getElementsByClassName("Food")
                    let randomIndex = random(foods.length)
                    let food = await this.findClosest(foods)

                    let goX = parseInt(food.style.left.substring(0, food.style.left.length - 2)) //remove the px from the pos
                    let goY = parseInt(food.style.top.substring(0, food.style.top.length - 2))

                    await this.moveTo(goX, goY, 1)

                    foods = document.getElementsByClassName("Food")
                    let newFood = await this.findClosest(foods)
                    try { //if food does not exist
                        if (food.dataset.beingUsedBy == "null") { //if it is not being used
                            food.dataset.foodLeft-- //reduce the amount of food in the object
                            food.dataset.beingUsedBy = this.object.id //set used by to itself
                            return food //return the food object
                        } else { //if it is being used
                            this.object.dataset.timesAttack++ //times attack go up for this.object
                            document.getElementById(food.dataset.beingUsedBy).dataset.timesDefend++ //times defended goes up for current user

                            let currentDefence = parseInt(document.getElementById(food.dataset.beingUsedBy).dataset.defence) //get current defence + attack
                            let currentAttack = parseInt(this.object.dataset.attack)

                            if (currentAttack > currentDefence) { //check to see if attack was successful

                                document.getElementById(food.dataset.beingUsedBy).dataset.healthPoints = parseInt(document.getElementById(food.dataset.beingUsedBy).dataset.healthPoints) - (currentAttack - currentDefence) //minus hp from defender                           

                                document.getElementById(food.dataset.beingUsedBy).dataset.timesDefend++ //increase times attacked
                                document.getElementById(food.dataset.beingUsedBy).dataset.defence++ //increase defence stat

                                food.dataset.foodLeft-- //remove another food
                                food.dataset.beingUsedBy = this.object.id //change the current user to itself
                                return food
                            } else {
                                this.object.dataset.healthPoints = parseInt(this.object.dataset.healthPoints) - (currentDefence - currentAttack) //minus hp from attacker

                                this.object.dataset.attack++ //incrase attack stat
                                this.object.dataset.timesAttack++ //increase times attacked
                                return 0 //return 'no food'
                            }
                        }
                    } catch {
                        return 0 //return 'no food'
                    }
                }
            }
            
            async function spawnOrb() {
                if (orbAmount < MAXORBS) { //check if to many orbs
                    orbAmount++ //add an orb
                    totalOrbAmount++ //add for Id orbs
                    const ball = new Orb() //create new orb
                    await ball.add("Orb"+totalOrbAmount) //call the add function

                    ball.startLogic() //start the logic
                }
            }

            function spawnFood() {
                foodAmount++
                const food = new Food()
                food.add('Food'+foodAmount)
            }
            
            function clearFood() {
                const foods = document.getElementsByClassName("Food")
                for (let i = foods.length - 1; i >= 0; i--) {
                    foods[i].remove()
                    foodAmount--
                }   
            }

            function showInfomation(object, ogID, red, green, blue) {
                const dataset = object.dataset
                document.getElementById("infoShower").style.visibility = "visible"
                document.getElementById("info0").innerHTML = "ID:" + object.id
                document.getElementById("info1").innerHTML = "Og ID:" + ogID
                document.getElementById("info2").innerHTML = "Red:" + red
                document.getElementById("info3").innerHTML = "Green:" + green
                document.getElementById("info4").innerHTML = "Blue:" + blue
                document.getElementById("info5").innerHTML = "A/D:" + dataset.timesAttack + "/" + dataset.timesDefend
                document.getElementById("info6").innerHTML = "HP:" + dataset.healthPoints
                document.getElementById("info7").innerHTML = "Attack:" + dataset.attack
                document.getElementById("info8").innerHTML = "Defence:" + dataset.defence
            }

            function Exit() {
                document.getElementById("infoShower").style.visibility = "hidden"
            }

        <style>
            .Orb {
                position: absolute;
                top: 0px;
                left: 0px;
                width: 70px;
                height: 70px;
                transform-origin: 50% 50%; /* half of width and height */
                border-color: black;
                border-width: 4px;
                border-style: solid;
                border-radius: 50%;
                z-index: 1;
            }
            .Food {
                position:absolute;
                width: 30px;
                height: 30px;
                transform-origin: 50% 50%;
                top: 0px;
                left: 0px;
                background-color: green;
                border-radius: 40%;
                text-align: center;
                z-index: 2;
            }
            .Button {
                position: absolute;
                z-index: 3;
            }
            .Overlay {
                width: 5.4%;
                height: 18%;
                position: absolute;
                display: block;
                z-index: 3;
                bottom: 10px;
                border-radius: 10%;
                visibility: hidden;
                background-color: rgb(84, 113, 113);
                top: 81%;
                left: 0.5%;
            }
            .OverlayText {
                position: absolute;
                top: -30px;
                left: 5%;
                font-size: 0.7vw;
            }
        </style>
    </head >
    <body style="background-color:rgb(32, 32, 32);">   
        <button id="addOrb" onclick="spawnOrb()" class="Button" style="left: 0px;">spawn Orb</button>
        <button id="clearFood" onclick="clearOrbs()" class="Button" style="left: 4px; top: 32px">clear Orbs</button>
        <button id="addFood" onclick="spawnFood()" class="Button" style="left: 80px;">spawn Food</button>
        <button id="clearFood" onclick="clearFood()" class="Button" style="left: 80px; top: 32px">clear Food</button>
        <p id="debug" style="position: absolute; top: 50px; visibility: hidden;">debug text</p>
        <div id="infoShower" class="Overlay">
            <button style="position: absolute; left: 80%; height: 15%; width: 20%; font-size: 0.7vw;" onclick="Exit()">x</button>
            <p id="info0" class="OverlayText" style="top: 0%;">info0:</p>
            <p id="info1" class="OverlayText" style="top: 10%;">info1:</p>
            <p id="info2" class="OverlayText" style="top: 20%">info2:</p>
            <p id="info3" class="OverlayText" style="top: 30%;">info3:</p>
            <p id="info4" class="OverlayText" style="top: 40%;">info4:</p>
            <p id="info5" class="OverlayText" style="top: 50%;">info5:</p>
            <p id="info6" class="OverlayText" style="top: 60%;">info6:</p>
            <p id="info7" class="OverlayText" style="top: 70%;">info7:</p>
            <p id="info8" class="OverlayText" style="top: 80%;">info8:</p>
        </div>
