<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Orb Sim 2!!</title>
  </head>

  <script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const Random = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const average = array => array.reduce((a, b) => a + b) / array.length;

    const MaxFrameRate = 100
    const MinFrameTime = 1000 / MaxFrameRate
    
    class Vector2 {
        constructor(x = 0, y = 0) {
            this.x = x
            this.y = y
        }

        Add(value) {
            if (value instanceof Vector2)
                return new Vector2(this.x + value.x, this.y + value.y);
            else if (typeof value == "number")
                return new Vector2(this.x + value, this.y + value);
            return -1;
        }

        Sub(value) {
            if (value instanceof Vector2)
                return new Vector2(this.x - value.x, this.y - value.y);
            else if (typeof value == "number")
                return new Vector2(this.x - Scaler, this.y - Scaler);
            return -1;
        }

        Multi(value) {
            if (value instanceof Vector2) 
                return new Vector2(this.x * value.x, this.y * value.y);
            else if (typeof value == "number")
                return new Vector2(this.x * value, this.y * value);
            return -1;
        }

        Divide(value) {
            if (value instanceof Vector2)
                return new Vector2(this.x / value.x, this.y / value.y);
            else if (typeof value == "number")
                return new Vector2(this.x / value, this.y / value);
            return -1;
        }
      
        DotProduct(Vector = Vector2) { return this.x * Vector.x + this.y * Vector.y}

        Magnitude() { return Math.sqrt(this.x**2 + this.y**2); }

        Normalized() { return this.Divide(this.Magnitude()); }

        Relfect(Normal = Vector2) { 
            const DotVel = this.DotProduct(Normal);
            return this.Sub(Normal.Multi(2 * DotVel))
        }

        static GetNormal(Vec1 = Vector2, Vec2 = Vector2, xNeg = Boolean) {
            let dx = Vec2.x - Vec1.x;
            let dy = Vec2.y - Vec1.y;
            let Normal;
            if (xNeg)
                Normal = new Vector2(-dy, dx);
            else if (!xNeg) 
                Normal = new Vector2(dy, -dx);
            let Length = Math.sqrt(Normal.x**2 + Normal.y**2);
            return Normal.Divide(Length);
        }

    }
    class Orb {
        constructor(id = Number, Vector = Vector2) {
            this.id = id
            this.position = Vector
            this.Velocity = new Vector2(Random(-10, 10), Random(-10, 10))
            this.radius = 25

            this.HasBounced = false
        }

        get x() { return this.position.x }
        get y() { return this.position.y }
    }

    function AddBall() {
        document.getElementById("BallsCount").textContent = parseInt(document.getElementById("BallsCount").textContent) + 1;
    }
    
    async function main() {
        const MainCanvas = document.getElementById("MainCanvas")
        MainCanvas.width = window.innerWidth;
        MainCanvas.height = window.innerHeight;
        const Draw = MainCanvas.getContext("2d")

        let delta = MinFrameTime / 1000;
        let lastTime = performance.now()

        let Orbs = {};
        let OrbPos = new Vector2();
        let frames = [];

        document.getElementById("AddBall").addEventListener("click", () => {
            let OrbId = crypto.randomUUID()
            Orbs[OrbId] = new Orb(OrbId, new Vector2(MainCanvas.width / 2, MainCanvas.height / 2))         
        })

        async function loop() {
            let start = performance.now();
            delta = (start - lastTime) / 1000;
            lastTime = start;

            Draw.clearRect(0, 0, MainCanvas.width, MainCanvas.height);

            for (const key in Orbs) {
                const firstOrb = Orbs[key];
                //Other ball collision
                for (const SecondKey in Orbs) {
                    const SecondOrb = Orbs[SecondKey];
                    if (firstOrb.HasBounced) break;
                    if (SecondKey == key || SecondOrb.HasBounced) continue;
                    
                    let distance = (firstOrb.x - SecondOrb.x)**2 + (firstOrb.y - SecondOrb.y)**2;
                    const DirectionVec = SecondOrb.position.Sub(firstOrb.position).Normalized();
                    const DotDirAndVel = DirectionVec.DotProduct(firstOrb.Velocity)
                    if (distance < (firstOrb.radius + SecondOrb.radius)**2 && DotDirAndVel < 1) { //AHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHH do this gngalang frfr frfr!!!
                        firstOrb.HasBounced = true;
                        SecondOrb.HasBounced = true;
                        const firstMag = firstOrb.Velocity.Magnitude();
                        const secondMag = SecondOrb.Velocity.Magnitude();
                        
                        if (firstMag > secondMag) {
                            const TempVel = firstOrb.Velocity; 
                            firstOrb.Velocity = SecondOrb.Velocity.Multi(-1);
                            SecondOrb.Velocity = TempVel;
                        } else if (firstMag < secondMag) {
                            const TempVel = SecondOrb.Velocity; 
                            SecondOrb.Velocity = firstOrb.Velocity.Multi(-1);
                            firstOrb.Velocity = TempVel;
                        } else if (firstMag == secondMag) {
                            SecondOrb.Velocity = SecondOrb.Velocity.Multi(-1);
                            firstOrb.Velocity = firstOrb.Velocity.Multi(-1);
                        } else throw new Error("tf did you do???" + firstMag + ", " + secondMag);
                        break;
                    }
                }

                //Wall collision
                const Borders = [
                    new Vector2(0, 0),
                    new Vector2(0, MainCanvas.height),
                    new Vector2(MainCanvas.width, MainCanvas.height),
                    new Vector2(MainCanvas.width, 0),
                    new Vector2(0, 0)
                ]

                for (let i = 0; i < 4; i++) {
                    Point1 = Borders[i];
                    Point2 = Borders[i+1];

                    const Line = Point2.Sub(Point1)
                    const LineNormal = Vector2.GetNormal(Point1, Point2, true)

                    const P1ToBall = firstOrb.position.Sub(Point1)
                    const P2ToBall = firstOrb.position.Sub(Point2)

                    const Midpoint = Point1.Add(new Vector2(Line.x / 2, Line.y / 2));
                    const MidToBall = firstOrb.position.Sub(Midpoint);
                    const DotBallToLine = MidToBall.DotProduct(LineNormal)

                    const DotVelToWall = firstOrb.Velocity.DotProduct(LineNormal)
                    
                    if (DotBallToLine <= firstOrb.radius && -DotBallToLine <= firstOrb.radius && DotVelToWall > 0) {
                        firstOrb.HasBounced = true;
                        firstOrb.Velocity = firstOrb.Velocity.Relfect(LineNormal);
                    }
                }

                firstOrb.position = firstOrb.position.Add(firstOrb.Velocity.Multi(delta * 100))
                
                Draw.beginPath();
                Draw.arc(firstOrb.x, firstOrb.y, firstOrb.radius, 0, Math.PI * 2); 
                
                if (firstOrb.HasBounced) Draw.fillStyle = "red";
                else Draw.fillStyle = "orange";
                
                Draw.fill();
                Draw.stroke();
            }

            for (const Key in Orbs) {
                const orb = Orbs[Key];
                orb.HasBounced = false;
            }
  
            let end = performance.now();

            let currentFps = delta > 0 ? Math.round(1 / delta) : 0;
            frames.unshift(currentFps);

            document.getElementById("fps").textContent = "fps: " + average(frames).toFixed(1);
            document.getElementById("delta").textContent = "delta: " + delta.toFixed(4) + " secs";
            if (frames.length > 50) frames.length = 50
        }
        setInterval(loop, MinFrameTime);
    }

    
    document.addEventListener("DOMContentLoaded", main);
    window.addEventListener("resize", () => {
        const MainCanvas = document.getElementById("MainCanvas");
        MainCanvas.width = window.innerWidth;
        MainCanvas.height = window.innerHeight;
    })
  </script>

  <body>
    <span id="fps">fps:</span><br>
    <span id="delta">delta:</span><br>
    <input id="AddBall" type="button" value="Add Ball" onclick="AddBall()" style="position: relative;"><br>
    <span>Balls: </span>
    <span id="BallsCount">0</span>
    <canvas id="MainCanvas" width="1920" height="1080" style="z-index: -1;"></canvas>
  </body>

  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      border:1px solid #d3d3d3;
    }
  </style>
</html>
