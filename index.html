<html>
    <head>
        <title>Orb sim</title>

        <script>
            let begun = false
            let orbAmount = 0
            let totalOrbAmount = 0
            let foodAmount = 0

            //settings
            const MAXDEATHTIMER = 20 //in sec
            const MAXINCREASEHUNGER = 40
            const MININCREASEHUNGER = 20
            const HUNGERNEEDEDTOSEARCHFORFOOD = 20 //when this is reached it will clone
            const HUNGERDEATHAMOUNT = 150 //when this is reached, death
            const MAXORBS = 250 //once this is hit they will stop spawning
            const STARTINGFOODAMOUNT = 0 //amount of times food can be used before it go boom, 0 is unlimited
            const MOVEMENTSPEED = 1 //in ms
            const CLONESPEED = 3000 //in sec
            const SLEEPLENGTH = 1 //in ms

            const MAXSTATDIFFERENCE = 5 //only for blue colour rn
            const RICHNESS = 20 //when no fight or defends, set blue bias to this
            const TOTALSTATBIAS = 15 //the amount that the stats can change in total
            const BASEATTACK = 0 //Is equal to red rgb
            const BASEDEFENCE = 0 //Is equal to green rgb
            const BASEHEALTH = 10
            
            //needed functions
            const SLEEP = (ms) => new Promise(resolve => setTimeout(resolve, ms))
            function random(maxAmount, minAmount = 0) {
                if (maxAmount > minAmount) {
                    let amount = maxAmount - minAmount
                    return Math.floor(Math.random() * amount) + minAmount
                } else if (maxAmount = minAmount) {
                    return maxAmount
                } else {
                    throw new Error("random() min: " + minAmount + " is larger than max: " + maxAmount)
                }
            }

            class Food {
                constructor(object, x, y, ID, foodLeft) {
                    this.ID = ID
                    this.object = object
                    this.x = 0
                    this.y = 0
                    this.foodLeft = STARTINGFOODAMOUNT
                }

                add(ID) {
                    const newObject = document.createElement("div")
                    newObject.classList.add('Food')
                    newObject.id = ID
                    newObject.dataset.foodLeft = STARTINGFOODAMOUNT
                    newObject.dataset.beingUsedBy = null
                    newObject.textContent = this.foodLeft
                    this.object = newObject
                    this.ID = ID    
                    document.body.appendChild(newObject)

                    this.setPos(random(window.innerWidth), random(window.innerHeight), 1)
                    if (STARTINGFOODAMOUNT != 0) {
                        this.checkFood()
                    } else {
                        newObject.textContent = ""
                    }
                }

                setPos(setX, setY) {
                    this.x = setX
                    this.y = setY
                    this.object.style.left = this.x
                    this.object.style.top = this.y
                }

                async checkFood() {
                    while (true) {
                        this.foodLeft = this.object.dataset.foodLeft
                        this.object.textContent = this.foodLeft
                        if (this.foodLeft == 0) {
                            foodAmount--
                            this.object.remove()
                            this.object = null
                            return
                        }
                        await SLEEP(10)
                    }
                }
            }

            class Orb {
                constructor(ID, ogID, object, x, y, hunger, isDead, lengthOfLife, red, green, blue) { // put needed to set things before object
                    this.ID = ID
                    this.ogID = ID
                    this.object = object
                    this.x = 0
                    this.y = 0
                    this.hunger = 1
                    this.isDead = false
                    this.lengthOfLife = 0
                    this.red = red //attack
                    this.green = green //defence
                    this.blue = blue
                }

                add(ID, ogID = ID, red = -1, green = -1, blue = -1, fights = 0, defends = 0) { //should only be called once per orb
                    //basic adding
                    const newOrb = document.createElement("div")
                    this.object = newOrb
                    newOrb.classList.add('Orb')
                    newOrb.id = ID
                    this.ID = ID
                    this.ogID = ogID

                    //so like js dont like this.var so like imma do smth bad... type shit
                    let idOfOG = this.ogID
                    newOrb.addEventListener("click", function() { showInfomation(newOrb, idOfOG, red, green, blue) })

                    if (ID != ogID) {
                        //stat randomizer
                        let maxRed = 255
                        let minRed = 0
                        let maxGreen = 255
                        let minGreen = 0
                        let maxBlue = 255
                        let minBlue = 0

                        let attackBias = fights
                        let defenceBias = defends
                        let blueBias = MAXSTATDIFFERENCE - (fights + defends)
                        if (attackBias + defenceBias != TOTALSTATBIAS) { //if total bias is not equal to tsb, contiune
                            let mutiplyer = (attackBias + defenceBias) / TOTALSTATBIAS //fine the multiplyer needed to bring total to tsb
                            attackBias *= mutiplyer //multiply ab and db by the multiplyer
                            defenceBias *= mutiplyer
                        }
                        if (attackBias == 0 && defenceBias == 0) {
                            attackBias = 1
                            defenceBias = 1
                            blueBias = 20
                        }

                        if (red != -1) { //set up min and max
                            maxRed = red + attackBias
                            // minRed = red - (defenceBias + (Math.floor(attackBias / 2)))
                            minRed = red - defenceBias
                            
                            minRed = minRed < 0 ? 0 : minRed
                            maxRed = maxRed > 255 ? 255 : maxRed
                            
                        }
                        if (green != -1) {
                            maxGreen = green + defenceBias
                            // minGreen = green - (attackBias + (Math.floor(defenceBias / 2)))
                            minGreen = green - attackBias

                            minGreen = minGreen < 0 ? 0 : minGreen
                            maxGreen = maxGreen > 255 ? 255 : maxGreen
                        }
                        if (blue != -1) {
                            maxBlue = blue + blueBias
                            minBlue = blue - MAXSTATDIFFERENCE
                            
                            minBlue = minBlue < 0 ? 0 : minBlue
                            maxBlue = maxBlue > 255 ? 255 : maxBlue
                        }

                        red = random(maxRed, minRed) //random the 'stats' of the orb
                        green = random(maxGreen, minGreen) 
                        blue = random(maxBlue, minBlue)
                    } else {
                        red = BASEATTACK
                        green = BASEDEFENCE
                        blue = 0    
                    }

                    // red = red < 0 ? 0 : red //making sure it dont go over or under the limit
                    // red = red > 255 ? 255 : red

                    // green = green < 0 ? 0 : green
                    // green = green > 255 ? 255 : green

                    // blue = blue < 0 ? 0 : blue
                    // blue = blue > 255 ? 255 : blue

                    red = Math.round(red)
                    green = Math.round(red)
                    blue = Math.round(red)
                    
                    this.red = red
                    this.green = green
                    this.blue = blue

                    this.object.style.backgroundColor = "rgb(" + red + "," + green + "," + blue + ")"

                    newOrb.dataset.attack = red
                    newOrb.dataset.defence = green
                    newOrb.dataset.timesAttack = 0
                    newOrb.dataset.timesDefend = 0
                    newOrb.dataset.healthPoints = BASEHEALTH

                    //append the child(orb)
                    document.body.appendChild(newOrb)     
                }

                async creation() {
                    if (this.hunger <= 0 && orbAmount < MAXORBS) {
                        orbAmount++
                        totalOrbAmount++
                        const ball = new Orb()
                        ball.x = this.x
                        ball.y = this.y
                        // await ball.add("Orb"+totalOrbAmount, this.ogID, this.red, this.green, this.blue)
                        await ball.add("Orb"+totalOrbAmount, this.ogID, this.red, this.green, this.blue, this.object.dataset.timesAttack, this.object.dataset.timesDefend)
                        ball.startLogic()
                    }
                }

                async startLogic() {
                    for (let i = 0; i < 100000; i++) {
                        //orb logic
                        let ate = false
                        if (this.hunger >= HUNGERNEEDEDTOSEARCHFORFOOD) {
                            let food = await this.findFood()
                            if (food != 0) {
                                if (food.dataset.beingUsedBy == this.object.id) {
                                    this.hunger = 0
                                    let successful = true
                                    for (let i = CLONESPEED / 4; i != 0; i--) {
                                        if (food.dataset.beingUsedBy == this.object.id) {
                                            await SLEEP(1)
                                        } else {
                                            successful = false
                                            break
                                        }
                                    }
                                    if (successful) { 
                                        await this.creation() 
                                        food.dataset.beingUsedBy = null
                                        ate = true
                                    }
                                } else {
                                    await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)
                                }
                            } else {
                                await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)
                            }
                        } else {
                            await this.moveTo(random(window.innerWidth - 75), random(window.innerHeight - 73), MOVEMENTSPEED)
                            
                            if (this.isDead) {
                                break
                            }
                            if (random(2) == 0) { //random chance to stop moving/sleep
                                await SLEEP(SLEEPLENGTH)
                                this.lengthOfLife += SLEEPLENGTH
                            }   
                        }
                        this.hunger += (ate) ? 0 : random(MAXINCREASEHUNGER, MININCREASEHUNGER)
                        if (this.deathCheck()) { return }
                    }
                }

                deathCheck() {
                    if (this.lengthOfLife >= MAXDEATHTIMER * 1000 || this.hunger >= HUNGERDEATHAMOUNT || this.object.dataset.healthPoints <= 0 || this.object == undefined) {
                        this.lengthOfLife = 0
                        console.log("noooo, he dead")
                        this.isDead = true
                        this.object.remove()
                        this.object = null
                        orbAmount--
                        return true
                    }
                }

                move(Xpx, Ypx) {
                    this.y += Ypx
                    this.x += Xpx

                    this.object.style.top = this.y + 'px'
                    this.object.style.left = this.x + 'px'
                }

                async moveTo(goX, goY, MS) {
                    let loop = 0

                    this.x = Math.round(this.x) //to make sure it not decimal 
                    this.y = Math.round(this.y)

                    if (goX == this.x && goY == this.y) { //just in case it is where it needs to go
                        return
                    }
                    
                    let gradient = (this.y - goY)/(this.x - goX) //gradient finding
                    let smallY = gradient
                    let smallX = 1
                    let difference = Math.abs(goX - this.x) //positive value of the difference

                    if (goX < this.x) { //check if it needs to go left and not right
                        smallX = Math.abs(smallX) * -1
                    }
                    
                    if (goY < this.y) { //same above but for smallY
                        smallY = Math.abs(smallY) * -1
                    }
                    else {
                        smallY = Math.abs(smallY)
                    }
                    if (Math.floor(smallY) > 2 || Math.floor(smallY) < -2) { 
                        let digits = Math.floor(smallY).toString().length
                        for (let i = 0; i < digits--; i++) {
                            smallY /= 10
                            smallX /= 10
                            difference *= 10
                        }
                    }           

                    while (loop < difference) {
                        loop++
                        this.move(smallX, smallY)
                        this.lengthOfLife += MS
                        if (loop > 10000) {
                            this.object.style.width = "200px"
                            this.object.style.height = "200px"
                            for (let i = 0; i < 30; i++) {
                                this.object.style.backgroundColor = "rgb("+random(255)+","+random(255)+","+random(255)+")"
                                await SLEEP(10)
                            }
                            this.object.remove()
                            throw new Error("loops: " + loop + ", Hunger: " + this.hunger + " goX:" + goX + " goY:" + goY + " X:" + this.x + " Y:" + this.y + " smallX:" + smallX + " smallY:" + smallY + " difference:" + difference + " gradient:" + gradient)
                        }
                        await this.deathCheck()
                        if (this.isDead) {
                            return
                        }
                        await SLEEP(MS)
                    }
                    this.x = Math.round(this.x) //just in case the num is like 835.0000000000001 or smth
                    this.y = Math.round(this.y)
                    this.object.style.top = this.y + 'px' //set the pos again for the round above
                    this.object.style.left = this.x + 'px'
                    if (goX != this.x || goY != this.y) { //If the end pos is not equal to the go pos
                        this.object.style.width = "200px"
                        this.object.style.height = "200px"
                        for (let i = 0; i < 30; i++) {
                            this.object.style.backgroundColor = "rgb("+random(255)+","+random(255)+","+random(255)+")"
                            await SLEEP(10)
                        }
                        this.object.remove()
                        throw new Error("oopies, move to position is not equal to end position, loops: " + loop + ", Hunger: " + this.hunger + " goX:" + goX + " goY:" + goY + " X:" + this.x + " Y:" + this.y + " smallX:" + smallX + " smallY:" + smallY + " difference:" + difference + " gradient:" + gradient)
                    }
                }

                async findFood() {
                    if (foodAmount == 0) {
                        return 0
                    }
                    let foods = document.getElementsByClassName("Food")
                    let randomIndex = random(foods.length)
                    let food = foods[randomIndex]
                    let goX = parseInt(food.style.left.substring(0, food.style.left.length - 2)) //remove the px from the pos
                    let goY = parseInt(food.style.top.substring(0, food.style.top.length - 2))

                    await this.moveTo(goX, goY, 1)

                    foods = document.getElementsByClassName("Food")
                    let newFood = foods[randomIndex]
                    if (food == newFood) {  
                        try {
                            if (food.dataset.beingUsedBy == "null") { //make sure it is not being used
                                food.dataset.foodLeft--
                                food.dataset.beingUsedBy = this.object.id
                                return food
                            } else { 
                                this.object.dataset.timesAttack++
                                document.getElementById(food.dataset.beingUsedBy).dataset.timesDefend++

                                if (this.object.dataset.attack > document.getElementById(food.dataset.beingUsedBy).dataset.defence) {
                                    let currentDefence = document.getElementById(food.dataset.beingUsedBy).dataset.defence
                                    let currentAttack = this.object.dataset.attack

                                    document.getElementById(food.dataset.beingUsedBy).dataset.healthPoints -= (currentAttack - currentDefence)                               

                                    document.getElementById(food.dataset.beingUsedBy).dataset.timesDefend++
                                    document.getElementById(food.dataset.beingUsedBy).dataset.defence++

                                    food.dataset.foodLeft--
                                    food.dataset.beingUsedBy = this.object.id
                                    return food
                                } else {
                                    this.object.dataset.attack++
                                    this.object.dataset.timesAttack++
                                    return 0
                                }
                            }
                        } catch (ex) {
                            return 0
                        }
                    }
                    return 0 //if no food 
                }
            }
            
            function spawnOrb() {
                if (orbAmount < MAXORBS) {
                    orbAmount++
                    totalOrbAmount++
                    const ball = new Orb()
                    ball.add("Orb"+totalOrbAmount)

                    ball.startLogic()
                }
            }

            function clearOrbs() {
                const orbs = document.getElementsByClassName("Orb")
                for (let i = orbs.length - 1; i >= 0; i--) {
                    orbs[i].remove()
                    orbAmount--
                }   
            }

            function spawnFood() {
                foodAmount++
                const food = new Food()
                food.add('Food'+foodAmount)
            }
            
            function clearFood() {
                const foods = document.getElementsByClassName("Food")
                for (let i = foods.length - 1; i >= 0; i--) {
                    foods[i].remove()
                    foodAmount--
                }   
            }

            function showInfomation(object, ogID, red, green, blue) {
                const dataset = object.dataset
                document.getElementById("infoShower").style.visibility = "visible"
                document.getElementById("info0").innerHTML = "ID:" + object.id
                document.getElementById("info1").innerHTML = "Og ID:" + ogID
                document.getElementById("info2").innerHTML = "Red:" + red
                document.getElementById("info3").innerHTML = "Green:" + green
                document.getElementById("info4").innerHTML = "Blue:" + blue
                document.getElementById("info5").innerHTML = "A/D:" + dataset.timesAttack + "/" + dataset.timesDefend
                document.getElementById("info6").innerHTML = "HP:" + dataset.healthPoints
                document.getElementById("info7").innerHTML = "Attack:" + dataset.attack
                document.getElementById("info8").innerHTML = "Defence:" + dataset.defence
            }

            function Exit() {
                document.getElementById("infoShower").style.visibility = "hidden"
            }
        </script>

        <style>
            .Orb {
                position: absolute;
                top: 0px;
                left: 0px;
                width: 70px;
                height: 70px;
                transform-origin: 50% 50%; /* half of width and height */
                background-color: red;
                border-color: black;
                border-width: 4px;
                border-style: solid;
                border-radius: 50%;
                z-index: 1;
                display: "none";
            }
            .Food {
                position:absolute;
                width: 30px;
                height: 30px;
                transform-origin: 50% 50%;
                top: 0px;
                left: 0px;
                background-color: green;
                border-radius: 40%;
                text-align: center;
                z-index: 2;
                display: "block";
            }
            .Button {
                position: absolute;
                display: "block";
                z-index: 3;
            }
            .Overlay {
                width: 120px;
                height: 220px;
                position: absolute;
                display: block;
                z-index: 3;
                bottom: 10px;
                border-radius: 10%;
                visibility: hidden;
                background-color: rgb(84, 113, 113);
            }
            .OverlayText {
                position: absolute;
                top: -30px;
                left: 10px;
            }
        </style>
    </head>
    <body>
        <button id="addOrb" onclick="spawnOrb()" class="Button" style="left: 0px;">spawn Orb</button>
        <button id="clearFood" onclick="clearOrbs()" class="Button" style="left: 4px; top: 32px">clear Orbs</button>
        <button id="addFood" onclick="spawnFood()" class="Button" style="left: 80px;">spawn Food</button>
        <button id="clearFood" onclick="clearFood()" class="Button" style="left: 80px; top: 32px">clear Food</button>
        <div id="infoShower" class="Overlay">
            <button style="position: relative; left: 100px; height: 30px;" onclick="Exit()">x</button>
            <p id="info0" class="OverlayText" style="top: 0;">info0:</p>
            <p id="info1" class="OverlayText" style="top: 25;">info1:</p>
            <p id="info2" class="OverlayText" style="top: 45">info2:</p>
            <p id="info3" class="OverlayText" style="top: 65;">info3:</p>
            <p id="info4" class="OverlayText" style="top: 85;">info4:</p>
            <p id="info5" class="OverlayText" style="top: 105;">info5:</p>
            <p id="info6" class="OverlayText" style="top: 125;">info6:</p>
            <p id="info7" class="OverlayText" style="top: 145;">info7:</p>
            <p id="info8" class="OverlayText" style="top: 165;">info8:</p>
        </div>
    </body>
</html>
